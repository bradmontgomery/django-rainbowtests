name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: py${{ matrix.python }} / django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { django: "5.2", python: "3.11" }
          - { django: "5.2", python: "3.12" }
          - { django: "5.2", python: "3.13" }
          - { django: "5.2", python: "3.14" }
          - { django: "6.0", python: "3.12" }
          - { django: "6.0", python: "3.13" }
          - { django: "6.0", python: "3.14" }
          - { django: "6.1", python: "3.12" }
          - { django: "6.1", python: "3.13" }
          - { django: "6.1", python: "3.14" }
          - { django: "6.1", python: "3.15" }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0  # astral publishes no floating major tags
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          uv sync --locked --group test
          uv pip install --upgrade "django~=${{ matrix.django }}.0"

      # --no-sync keeps uv from reverting Django to the locked version.
      - name: Show versions
        run: uv run --no-sync python -c "import sys, django; print(sys.version); print('Django', django.get_version())"

      - name: Run tests (100% coverage required)
        run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # astral publishes no floating major tags
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # astral publishes no floating major tags
        with:
          python-version: "3.14"
      - run: uv build
      - name: Check the wheel installs and imports
        run: uv run --isolated --no-project --with dist/*.whl python -c "import rainbowtests.test.runner"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
