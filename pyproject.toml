[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-rainbowtests"
dynamic = ["version"]
description = "A colorful Django Test Runner."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Brad Montgomery", email = "brad@bradmontgomery.net" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.2",
    "rich>=13",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bradmontgomery/django-rainbowtests"
Repository = "https://github.com/bradmontgomery/django-rainbowtests"

[tool.setuptools.dynamic]
version = { attr = "rainbowtests.__version__" }

[tool.setuptools.packages.find]
include = ["rainbowtests*"]

[tool.setuptools.package-data]
rainbowtests = ["py.typed"]

[dependency-groups]
dev = ["ruff", "ty==0.0.109"]
test = ["pytest", "pytest-cov", "coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=rainbowtests --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
